# Derived from configs/multigoal/train_ppo_lag_SafetyAntMultiGoal1Pair-v0.yaml by scripts/pipeline/make_pilot_config.py (comments not preserved)
task: PPO-Lag-MG1-Pair-pilot
group: PPO-Lag
device: cpu
verbose: 2
env:
  config_path: null
  train_env_id: SafetyAntMultiGoal1Pair-v0
  eval_env_id: SafetyAntMultiGoal1Pair-v0
  save_dir: ../../../runs
  cost_info_str: cost
  use_cost: true
  reward_gamma: 0.99
  cost_gamma: 0.99
  dont_normalize_obs: false
  dont_normalize_reward: false
  dont_normalize_cost: false
  record_info_names: []
running:
