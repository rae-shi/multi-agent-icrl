# PPO-Lagrangian expert on MultiGoal level 1 (joint-action adapter).
# Adapted from the HalfCheetah config of the ICRL benchmark. Run from algos/icrl/interface.
task: 'PPO-Lag-MG1'
group: 'PPO-Lag'
device: 'cpu'
verbose: 2
env:
  config_path: null
  train_env_id : 'SafetyAntMultiGoal1Joint-v0'
  eval_env_id: 'SafetyAntMultiGoal1Joint-v0'
  save_dir: '../../../runs'           # = <repo>/runs when run from algos/icrl/interface; must exist
  cost_info_str: 'cost'
  use_cost: True
  reward_gamma: 0.99
  cost_gamma: 0.99
  dont_normalize_obs: False
  dont_normalize_reward: False
  dont_normalize_cost: False
  record_info_names: []               # the HalfCheetah config records 'xpos'; MultiGoal has no such key

running:
  n_iters: 3
  n_eval_episodes: 10
  save_every: 5
  expert_rollouts: 10
  sample_rollouts: 10
  store_sample_rollouts: 500
  expert_path: '../../../runs/expert_data/MultiGoal1/'    # must exist
  use_buffer: False
  store_by_game: False

PPO:
  policy_name: 'TwoCriticsMlpPolicy'
  learning_rate: 0.0003
  n_steps: 2048
  n_epochs: 10
  reward_gamma: 0.99
  reward_gae_lambda: 0.95
  cost_gamma: 0.99
  cost_gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  reward_vf_coef: 0.5
  cost_vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: False
  sde_sample_freq: -1
  target_kl: 0.01
  shared_layers: null
  policy_layers: [64, 64]
  reward_vf_layers: [64, 64]
  cost_vf_layers: [64, 64]
  batch_size: 64
  eval_every: 2048
  use_curiosity_driven_exploration: False
  warmup_timesteps: False
  reset_policy: False
  forward_timesteps: 20000
  clip_range_reward_vf: null
  clip_range_cost_vf: null
  penalty_initial_value: 1
  penalty_learning_rate: 0.1
  budget: 0                           # cost limit: an open choice, to discuss
  proportional_control_coeff: 10
  integral_control_coeff: 0.0001
  derivative_control_coeff: 0
  pid_delay: 1
  proportional_cost_ema_alpha: 0.5
  derivative_cost_ema_alpha: 0.5
